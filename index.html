<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Ẩn Danh - Gửi Lời Nhắn</title>
    
    <!-- Thư viện Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Font chữ hiện đại Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button.send-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.send-btn:hover {
            background: #5563c1;
        }

        h1 {
            font-size: 18px;
            color: #444;
            margin-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        ul {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        ul::-webkit-scrollbar {
            width: 6px;
        }

        ul::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        li {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
            animation: fadeIn 0.3s ease-in-out;
            word-break: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button.delete-btn {
            background: #ff5252;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
            margin-left: 10px;
        }

        button.delete-btn:hover {
            background: #ff1744;
        }

        .empty-text {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💌 Gửi lời nhắn ẩn danh</h2>
        
        <div class="input-group">
            <input type="text" id="msgInput" placeholder="Nhập gì đó đi..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMsg()">Gửi</button>
        </div>
        
        <h1>Danh sách lời nhắn:</h1>
        <ul id="list">
            <div class="empty-text">Đang tải lời nhắn...</div>
        </ul>
    </div>

    <!-- Nhúng file cấu hình và file logic vào hệ thống -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
