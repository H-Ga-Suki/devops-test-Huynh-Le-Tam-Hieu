<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng Ẩn Danh</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Gửi lời nhắn ẩn danh</h2>
    <input type="text" id="msgInput" placeholder="Nhập gì đó đi...">
    <button onclick="sendMsg()">Gửi</button>
    
    <h1>Các lời nhắn:</h1>
    <ul id="list"></ul>

    <script>
        const SUPABASE_URL = 'https://dbxtwsnfhdsvvhpwwefr.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_rexxz2BRDiT2WAzsihvJlw_zZSj9ZJR';
        
    
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Hàm lấy dữ liệu
        async function fetchMsgs() {
            let { data, error } = await supabaseClient.from('confessions').select('*');
            
            if (error) {
                console.error("Lỗi lấy dữ liệu:", error);
                return;
            }
            
            if (data) {
                document.getElementById('list').innerHTML = data.map(d => `<li>${d.message}</li>`).join('');
            }
        }

        // Hàm gửi dữ liệu
        async function sendMsg() {
            const input = document.getElementById('msgInput');
            if (input.value.trim() === '') return;
            
            let { error } = await supabaseClient.from('confessions').insert([{ message: input.value }]);
            
            if (error) {
                console.error("Lỗi gửi dữ liệu:", error);
                alert("Gửi lỗi rồi, ấn F12 chuyển qua tab Console để xem lỗi nhé!");
            } else {
                input.value = ''; 
                fetchMsgs(); 
            }
        }

        fetchMsgs();
    </script>
</body>
</html>
